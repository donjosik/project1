<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Login</title>
</head>
<body>
    <div id="loginPage">
        <div class="background d-flex flex-column justify-content-center align-items-center vh-100">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="login-container ml-auto mr-auto">
                            <h1>Login</h1>
                            <form id="loginForm" class="mt-4">
                                <div class="mb-3 form-group">
                                    <label for = "username">Username:</label>
                                    <input type = "text" id = "username" name = "username" class="form-control">
                                    <div class="invalid-feedback">Username cannot be empty</div>
                                </div>
                                <div class="form-group">
                                    <label for = "password">Password:</label>
                                    <input type = "password" id = "password" name = "password" class="form-control">
                                    <div class="invalid-feedback">Password cannot be empty</div>
                                </div>
                                <div class="mt-4">
                                    <button class="login-button" type = "submit" id="loginBtn">Login</button>
                                </div>
                                <a href="register.html" class="mt-3" style="color:darkgreen">Do you have an account? Register</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
